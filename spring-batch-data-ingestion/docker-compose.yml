version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: orderdb-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: batchuser
      POSTGRES_PASSWORD: batchpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batchuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
